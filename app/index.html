<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محلل الوظائف الذكي — [Your Name]</title>
<style>
/* ===== Design Tokens (uiux-pro: 4px scale + elevation + semantic colors) ===== */
:root{
  --bg:#0a0a0f;--surface:#12121a;--card:#1a1a2e;--card-hover:#222240;--border:#2a2a3e;
  --text:#e0e0f0;--text-strong:#ffffff;--muted:#8888aa;--muted-2:#5a5a78;
  --accent:#00d4aa;--accent-hover:#00f0c2;--accent2:#7c5cff;--red:#ff4466;--gold:#ffd700;--green:#00d4aa;
  --success:#00d4aa;--warning:#ffd700;--danger:#ff4466;
  /* spacing scale 4px base */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;
  /* radius scale */
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:999px;
  /* elevation */
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.35);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
  /* z-index scale */
  --z-header:100;--z-modal:200;--z-toast:300;
  /* animation */
  --dur-fast:.15s;--dur-med:.3s;--dur-slow:.5s;--ease:cubic-bezier(.4,0,.2,1);
  /* typography scale */
  --fs-xs:.7rem;--fs-sm:.8rem;--fs-md:.9rem;--fs-lg:1.1rem;--fs-xl:1.5rem;--fs-2xl:2rem;
}
*{margin:0;padding:0;box-sizing:border-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;line-height:1.6}
::selection{background:var(--accent);color:#000}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}

/* ===== Header ===== */
.header{background:linear-gradient(135deg,#12121a 0%,#1a1a3e 100%);border-bottom:1px solid var(--border);padding:var(--s6) var(--s8);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:var(--z-header);backdrop-filter:blur(10px)}
.header h1{font-size:var(--fs-xl);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.header .subtitle{color:var(--muted);font-size:var(--fs-sm);margin-top:var(--s1)}

/* ===== Stats Bar ===== */
.stats-bar{display:flex;gap:var(--s4);padding:var(--s4) var(--s8);background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4) var(--s5);min-width:140px;text-align:center;flex-shrink:0;box-shadow:var(--shadow-sm);transition:transform var(--dur-fast) var(--ease)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card .value{font-size:var(--fs-2xl);font-weight:800;color:var(--accent)}
.stat-card .label{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s1)}

/* ===== Controls ===== */
.controls{display:flex;gap:var(--s3);padding:var(--s4) var(--s8);background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-box{width:100%;padding:var(--s3) var(--s4);padding-left:var(--s8);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:var(--fs-md);outline:none;transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,.15)}
.search-clear{position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:var(--fs-lg);cursor:pointer;display:none;line-height:1}
.search-clear.show{display:block}
.search-clear:hover{color:var(--red)}
.filter-btn{padding:var(--s2) var(--s4);background:var(--card);border:1px solid var(--border);border-radius:var(--r-full);color:var(--muted);font-size:var(--fs-sm);cursor:pointer;transition:all var(--dur-fast) var(--ease);white-space:nowrap}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(0,212,170,.3)}
.filter-count{display:inline-block;background:rgba(255,255,255,.15);border-radius:var(--r-full);padding:0 6px;font-size:var(--fs-xs);margin-left:4px;font-weight:600}
.filter-btn.active .filter-count{background:rgba(0,0,0,.2)}
.sort-select{padding:var(--s2) var(--s3);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:var(--fs-sm);cursor:pointer;outline:none}

/* ===== Jobs Grid ===== */
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--s4);padding:var(--s6) var(--s8)}
.job-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);cursor:pointer;transition:transform var(--dur-med) var(--ease),border-color var(--dur-med) var(--ease),box-shadow var(--dur-med) var(--ease);position:relative;overflow:hidden;animation:cardIn .4s var(--ease) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.job-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.job-card:active{transform:translateY(-1px) scale(.995)}
.job-card .score-badge{position:absolute;top:var(--s3);left:var(--s3);background:var(--card);border:2px solid;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);font-weight:800;box-shadow:var(--shadow-sm)}
.score-high{border-color:var(--green);color:var(--green)}
.score-mid{border-color:var(--gold);color:var(--gold)}
.score-low{border-color:var(--red);color:var(--red)}
.job-card .title{font-size:var(--fs-md);font-weight:700;margin-bottom:var(--s2);padding-left:56px;line-height:1.4;color:var(--text-strong)}
.job-card .meta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.job-card .tag{font-size:var(--fs-xs);padding:2px 10px;border-radius:var(--r-full);background:rgba(0,212,170,.1);color:var(--accent);border:1px solid rgba(0,212,170,.25)}
.job-card .desc{font-size:var(--fs-sm);color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:var(--s3)}
.job-card .skills-match{display:flex;gap:var(--s1);flex-wrap:wrap}
.job-card .skill-chip{font-size:var(--fs-xs);padding:2px 8px;border-radius:var(--r-sm);background:rgba(0,212,170,.15);color:var(--green);border:1px solid rgba(0,212,170,.2)}
.job-card .apply-btn{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s3);padding:var(--s2) var(--s4);background:var(--accent);color:#000;border:none;border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:700;cursor:pointer;text-decoration:none;transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.job-card .apply-btn:hover{background:var(--accent2);color:#fff;transform:translateX(-2px)}

/* ===== Skeleton Loading ===== */
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-md)}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);min-height:140px}
.sk-line{height:14px;border-radius:var(--r-sm);margin-bottom:var(--s3)}
.sk-line.w60{width:60%}.sk-line.w40{width:40%}.sk-line.w80{width:80%}.sk-line.w30{width:30%}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:var(--z-modal);display:none;align-items:center;justify-content:center;padding:var(--s5);animation:fadeIn var(--dur-med) var(--ease)}
.modal-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:900px;max-height:90vh;overflow-y:auto;padding:var(--s8);position:relative;animation:slideUp var(--dur-med) var(--ease);box-shadow:var(--shadow-lg)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:var(--s4);left:var(--s4);background:var(--card);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;color:var(--muted);font-size:var(--fs-lg);cursor:pointer;transition:all var(--dur-fast) var(--ease);display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--red);border-color:var(--red);transform:rotate(90deg)}
.modal h2{font-size:var(--fs-xl);margin-bottom:var(--s2);color:var(--accent);line-height:1.3}
.modal .job-meta{color:var(--muted);font-size:var(--fs-sm);margin-bottom:var(--s5)}
.modal-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s4)}
.modal-section h3{font-size:var(--fs-md);margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s2)}
/* progress ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:var(--s4)}
.progress-ring{margin:0 auto var(--s3)}
.progress-ring .ring-bg{fill:none;stroke:var(--border);stroke-width:8}
.progress-ring .ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s var(--ease)}
.ring-label{color:var(--muted);font-size:var(--fs-sm)}
.gap-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s2);display:flex;justify-content:space-between;align-items:center;transition:border-color var(--dur-fast) var(--ease)}
.gap-item:hover{border-color:var(--accent)}
.gap-item .info{flex:1}
.gap-item .category{font-weight:600;font-size:var(--fs-sm)}
.gap-item .advice{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s1)}
.gap-item .priority{font-size:var(--fs-xs);padding:2px 10px;border-radius:var(--r-full);font-weight:700}
.priority-high{background:rgba(255,68,102,.15);color:var(--red)}
.priority-medium{background:rgba(255,215,0,.15);color:var(--gold)}
.priority-low{background:rgba(0,212,170,.15);color:var(--green)}
.hr-tabs{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.hr-tab{padding:var(--s2) var(--s4);background:var(--card);border:1px solid var(--border);border-radius:var(--r-full);cursor:pointer;font-size:var(--fs-sm);color:var(--muted);transition:all var(--dur-fast) var(--ease)}
.hr-tab:hover{border-color:var(--accent);color:var(--accent)}
.hr-tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.hr-content{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4);font-size:var(--fs-sm);line-height:1.8;white-space:pre-wrap;max-height:300px;overflow-y:auto;direction:ltr;text-align:left}
.copy-btn{margin-top:var(--s2);padding:var(--s2) var(--s4);background:var(--accent2);color:#fff;border:none;border-radius:var(--r-md);font-size:var(--fs-sm);cursor:pointer;transition:all var(--dur-fast) var(--ease)}
.copy-btn:hover{background:var(--accent);color:#000}

/* ===== Empty State ===== */
.no-jobs{text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1;animation:cardIn .4s var(--ease)}
.no-jobs .empty-icon{font-size:3.5rem;margin-bottom:var(--s4);opacity:.6}
.no-jobs h2{font-size:var(--fs-xl);margin-bottom:var(--s2);color:var(--text)}
.no-jobs p{font-size:var(--fs-md);color:var(--muted-2);margin-bottom:var(--s4)}
.no-jobs .empty-btn{padding:var(--s2) var(--s6);background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:var(--r-full);cursor:pointer;font-size:var(--fs-sm);transition:all var(--dur-fast) var(--ease)}
.no-jobs .empty-btn:hover{background:var(--accent);color:#000}

/* ===== Toast ===== */
.toast-container{position:fixed;bottom:var(--s6);right:50%;transform:translateX(50%);z-index:var(--z-toast);display:flex;flex-direction:column;gap:var(--s2);align-items:center;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--accent);color:var(--text);padding:var(--s3) var(--s6);border-radius:var(--r-full);font-size:var(--fs-sm);box-shadow:var(--shadow-lg);pointer-events:auto;animation:toastIn var(--dur-med) var(--ease);display:flex;align-items:center;gap:var(--s2)}
.toast.show-ok{border-color:var(--success)}
.toast.show-err{border-color:var(--danger)}
.toast svg{width:18px;height:18px}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:toastOut var(--dur-med) var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(16px) scale(.9)}}

/* ===== Back to top ===== */
.back-to-top{position:fixed;bottom:var(--s6);left:var(--s6);width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;border:none;font-size:var(--fs-lg);font-weight:800;cursor:pointer;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transition:all var(--dur-med) var(--ease);z-index:var(--z-toast)}
.back-to-top.visible{opacity:1;visibility:visible}
.back-to-top:hover{background:var(--accent2);color:#fff;transform:scale(1.1)}

/* ===== Responsive ===== */
@media(max-width:768px){.jobs-grid{grid-template-columns:1fr;padding:var(--s4)}.header{padding:var(--s4)}.controls{padding:var(--s3)}.stats-bar{padding:var(--s3)}.stat-card{min-width:100px}.modal{padding:var(--s5)}}
@media(max-width:480px){.stats-bar{gap:var(--s2)}.stat-card{min-width:88px}.stat-card .value{font-size:var(--fs-xl)}.job-card{padding:var(--s4)}}
</style>
</head>
<body>
<div class="header">
<div>
<h1>محلل الوظائف الذكي</h1>
<div class="subtitle">تحليل CV + فجوة المهارات + قوالب HR جاهزة</div>
</div>
<button class="filter-btn" onclick="refreshJobs()" style="background:var(--accent);color:#000;border-color:var(--accent);font-weight:700">⟳ تحديث</button>
</div>

<div class="stats-bar">
<div class="stat-card"><div class="value" id="totalJobs">—</div><div class="label">وظيفة مطابقة</div></div>
<div class="stat-card"><div class="value" id="avgScore">—</div><div class="label">متوسط التقييم</div></div>
<div class="stat-card"><div class="value" id="maxScore">—</div><div class="label">أعلى تقييم</div></div>
<div class="stat-card"><div class="value" id="highMatch">—</div><div class="label">تطابق عالي (>50)</div></div>
</div>

<div class="controls">
<div class="search-wrap">
<input type="text" class="search-box" id="searchBox" placeholder="ابحث بالاسم، الشركة، الموقع، المهارات..." oninput="onSearchInput(this.value)">
<button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
</div>
<button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">الكل <span class="filter-count" id="countAll">0</span></button>
<button class="filter-btn" data-filter="high" onclick="setFilter('high',this)">عالٍ <span class="filter-count" id="countHigh">0</span></button>
<button class="filter-btn" data-filter="mid" onclick="setFilter('mid',this)">متوسط <span class="filter-count" id="countMid">0</span></button>
<button class="filter-btn" data-filter="low" onclick="setFilter('low',this)">منخفض <span class="filter-count" id="countLow">0</span></button>
<select class="sort-select" id="sortSelect" onchange="sortJobs()">
<option value="score_desc">الأعلى تقييماً</option>
<option value="score_asc">الأدنى تقييماً</option>
<option value="title_asc">الاسم (أ-ي)</option>
<option value="source_asc">المصدر</option>
</select>
</div>

<div class="jobs-grid" id="jobsGrid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<button class="modal-close" onclick="closeModal()" aria-label="إغلاق">✕</button>
<div id="modalContent"></div>
</div>
</div>

<div class="toast-container" id="toastContainer"></div>

<button class="back-to-top" id="backToTop" aria-label="العودة للأعلى">↑</button>

<script>
let allJobs=[];
let currentFilter='all';
let currentSort='score_desc';
let searchTerm='';
let searchTimer=null;

/* ===== Toast (shadcn style) ===== */
function toast(msg,type='ok'){
const c=document.getElementById('toastContainer');
const t=document.createElement('div');
t.className='toast '+(type==='ok'?'show-ok':'show-err');
const icon=type==='ok'?'<svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
t.innerHTML=icon+'<span>'+msg+'</span>';
c.appendChild(t);
setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350)},2400);
}

/* ===== Data Loading with skeleton ===== */
async function loadJobs(){
showSkeletons();
try{
const r=await fetch('/api/jobs');
const d=await r.json();
allJobs=d.jobs||[];
updateStats();
renderJobs(allJobs);
}catch(e){
document.getElementById('jobsGrid').innerHTML='<div class="no-jobs"><div class="empty-icon">⚠️</div><h2>فشل تحميل البيانات</h2><p>تأكد أن الخادم يعمل</p><button class="empty-btn" onclick="loadJobs()">إعادة المحاولة</button></div>';
}
}

function showSkeletons(){
const g=document.getElementById('jobsGrid');
g.innerHTML=Array.from({length:6}).map(()=>`<div class="sk-card"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w40"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w30"></div></div>`).join('');
}

function updateStats(){
const total=allJobs.length;
const scores=allJobs.map(j=>j.analysis.score);
const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
const max=scores.length?Math.max(...scores):0;
const high=scores.filter(s=>s>50).length;
document.getElementById('totalJobs').textContent=total;
document.getElementById('avgScore').textContent=avg;
document.getElementById('maxScore').textContent=max;
document.getElementById('highMatch').textContent=high;
document.getElementById('countAll').textContent=total;
document.getElementById('countHigh').textContent=high;
document.getElementById('countMid').textContent=scores.filter(s=>s>=25&&s<=50).length;
document.getElementById('countLow').textContent=scores.filter(s=>s<25).length;
}

/* ===== Search with debounce ===== */
function onSearchInput(v){
searchTerm=v.trim().toLowerCase();
document.getElementById('searchClear').classList.toggle('show',searchTerm.length>0);
clearTimeout(searchTimer);
searchTimer=setTimeout(filterJobs,300);
}
function clearSearch(){
document.getElementById('searchBox').value='';
searchTerm='';
document.getElementById('searchClear').classList.remove('show');
filterJobs();
}

function filterJobs(){
let filtered=allJobs;
if(searchTerm){
filtered=allJobs.filter(j=>{
const search=(j.title+' '+j.company+' '+j.location+' '+j.source+' '+(j.analysis.matched||[]).map(m=>m.category).join(' ')).toLowerCase();
return search.includes(searchTerm);
});
}
if(currentFilter==='high')filtered=filtered.filter(j=>j.analysis.score>50);
else if(currentFilter==='mid')filtered=filtered.filter(j=>j.analysis.score>=25&&j.analysis.score<=50);
else if(currentFilter==='low')filtered=filtered.filter(j=>j.analysis.score<25);
sortAndRender(filtered);
}

function sortJobs(){currentSort=document.getElementById('sortSelect').value;filterJobs();}

function sortAndRender(jobs){
const s=currentSort;
jobs=[...jobs].sort((a,b)=>{
if(s==='score_desc')return b.analysis.score-a.analysis.score;
if(s==='score_asc')return a.analysis.score-b.analysis.score;
if(s==='title_asc')return a.title.localeCompare(b.title);
if(s==='source_asc')return a.source.localeCompare(b.source);
return 0;
});
renderJobs(jobs);
}

function renderJobs(jobs){
const g=document.getElementById('jobsGrid');
if(!jobs.length){
g.innerHTML=`<div class="no-jobs">
<div class="empty-icon">🔍</div>
<h2>لا توجد وظائف مطابقة</h2>
<p>${searchTerm?'لا نتائج لبحثك "'.concat(esc(searchTerm),'". جرّب كلمات أخرى'):'جرّب تغيير الفلتر أو تصفح كل الوظائف'}</p>
<button class="empty-btn" onclick="resetAll()">عرض كل الوظائف</button>
</div>`;
return;
}
g.innerHTML=jobs.map((j,idx)=>{
const sc=j.analysis.score;
const cls=sc>50?'score-high':sc>=25?'score-mid':'score-low';
const matchedSkills=(j.analysis.matched||[]).slice(0,4).map(m=>'<span class="skill-chip">'+m.category+'</span>').join('');
return `<div class="job-card" style="animation-delay:${Math.min(idx*40,400)}ms" onclick='openModal(${JSON.stringify(j).replace(/'/g,"&#39;")})'>
<div class="score-badge ${cls}">${sc}</div>
<div class="title">${esc(j.title)}</div>
<div class="meta">
<span class="tag">${esc(j.source)}</span>
${j.salary?'<span class="tag">'+esc(j.salary)+'</span>':''}
${j.location?'<span class="tag">'+esc(j.location)+'</span>':''}
</div>
<div class="desc">${esc(j.company||'')}</div>
<div class="skills-match">${matchedSkills}</div>
<a class="apply-btn" href="${esc(j.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">قدّم الآن ←</a>
</div>`}).join('');
}

function resetAll(){
searchTerm='';
document.getElementById('searchBox').value='';
document.getElementById('searchClear').classList.remove('show');
setFilter('all',document.querySelector('.filter-btn[data-filter="all"]'));
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function setFilter(f,el){
currentFilter=f;
document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
filterJobs();
}

/* ===== Modal with progress ring ===== */
async function openModal(job){
document.getElementById('modalOverlay').classList.add('show');
document.querySelector('.modal').scrollTop=0;
document.getElementById('modalContent').innerHTML=`
<div class="modal-section"><div class="skeleton sk-line w80" style="height:20px"></div></div>
<div class="modal-section"><div class="skeleton" style="width:90px;height:90px;border-radius:50%;margin:0 auto"></div></div>
<div class="modal-section"><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div>`;
const r=await fetch('/api/analyze?title='+encodeURIComponent(job.title)+'&desc='+encodeURIComponent(job.source)+'&company='+encodeURIComponent(job.company));
const d=await r.json();
const a=d.analysis;
const sc=a.score;
const color=sc>50?'var(--green)':sc>=25?'var(--gold)':'var(--red)';
const ringColor=sc>50?'#00d4aa':sc>=25?'#ffd700':'#ff4466';

currentHrEn=d.hr_en;
currentHrAr=d.hr_ar;

let matchedHtml='<div style="display:flex;gap:8px;flex-wrap:wrap">'+(a.matched.map(m=>'<span class="skill-chip" style="font-size:.8rem;padding:4px 10px">'+m.category+': '+esc(m.skills.join(', '))+'</span>').join('')||'<span style="color:var(--muted)">لا توجد مهارات مطابقة</span>')+'</div>';

let missingHtml='';
if(d.gaps&&d.gaps.length){
missingHtml=d.gaps.map(g=>`<div class="gap-item">
<div class="info">
<div class="category">${g.category}</div>
<div class="advice">${esc(g.course)} — ${esc(g.platform)} (${esc(g.duration)}) — ${esc(g.cost)}</div>
</div>
<span class="priority priority-${g.priority}">${g.priority==='high'?'مهم':g.priority==='medium'?'متوسط':'منخفض'}</span>
</div>`).join('');
}

document.getElementById('modalContent').innerHTML=`
<h2>${esc(job.title)}</h2>
<div class="job-meta">${esc(job.company)} • ${esc(job.location)} • ${esc(job.source)} ${job.salary?'• '+esc(job.salary):''}</div>

<div class="modal-section" style="text-align:center">
<div class="ring-wrap">
<svg class="progress-ring" width="110" height="110" viewBox="0 0 110 110">
<circle class="ring-bg" cx="55" cy="55" r="48"/>
<circle class="ring-fg" cx="55" cy="55" r="48" stroke="${ringColor}" stroke-dasharray="301.59" stroke-dashoffset="301.59" id="ringFg"/>
</svg>
<div style="position:relative;margin-top:-86px;font-size:1.6rem;font-weight:800;color:${color}">${sc}%</div>
</div>
<div style="color:var(--muted);font-size:.85rem">نسبة التطابق مع CVك</div>
</div>

<div class="modal-section">
<h3>✅ المهارات المطابقة (${a.matched_count})</h3>
${matchedHtml}
</div>

${missingHtml?'<div class="modal-section"><h3>⚠️ الفجوة ('+a.missing_count+') — دورات مقترحة</h3>'+missingHtml+'</div>':''}

<div class="modal-section">
<h3>📝 رسالة HR</h3>
<div class="hr-tabs">
<div class="hr-tab active" onclick="showHrTab('en',this)">English</div>
<div class="hr-tab" onclick="showHrTab('ar',this)">عربي</div>
</div>
<div class="hr-content" id="hrContent">${esc(d.hr_en)}</div>
<button class="copy-btn" onclick="copyHr()">📋 نسخ الرسالة</button>
</div>

<div style="text-align:center;margin-top:var(--s4)">
<a href="${esc(job.url)}" target="_blank" class="apply-btn" style="font-size:.9rem;padding:10px 24px">قدّم الآن ←</a>
</div>`;

// animate ring after render
requestAnimationFrame(()=>{setTimeout(()=>{document.getElementById('ringFg').style.strokeDashoffset=301.59-(301.59*sc/100);},50)});
}

let currentHrEn='',currentHrAr='';

function showHrTab(lang,el){
document.querySelectorAll('.hr-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('hrContent').textContent=lang==='en'?currentHrEn:currentHrAr;
}

function copyHr(){
const t=document.getElementById('hrContent').textContent;
navigator.clipboard.writeText(t).then(()=>toast('تم نسخ الرسالة ✓')).catch(()=>toast('فشل النسخ','err'));
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ===== Back to top behavior ===== */
const backToTop=document.getElementById('backToTop');
window.addEventListener('scroll',()=>backToTop.classList.toggle('visible',window.scrollY>500),{passive:true});
backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

function refreshJobs(){loadJobs();toast('جاري التحديث...')}

loadJobs();
</script>
</body>
</html>
