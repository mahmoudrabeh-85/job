<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>داشبورد البحث عن عمل — [Your Name]</title>
<style>
/* ===== Design Tokens (Industrial + uiux-pro hybrid) ===== */
:root{
  --bg:#0a0a0f;--surface:#12121a;--card:#1a1a2e;--border:#2a2a3e;
  --text:#e0e0f0;--text-strong:#fff;--muted:#8888aa;
  --accent:#00d4aa;--accent2:#7c5cff;--gold:#ffd700;--red:#ff4466;--green:#00d4aa;--blue:#4da3ff;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:99px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.35);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --z-header:100;--z-tab:90;
  --dur-fast:.15s;--ease:cubic-bezier(.4,0,.2,1);
  --fs-xs:.7rem;--fs-sm:.8rem;--fs-md:.9rem;--fs-lg:1.1rem;--fs-xl:1.4rem;
}
*{margin:0;padding:0;box-sizing:border-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
::selection{background:var(--accent);color:#000}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r-full)}

/* ===== Header ===== */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:var(--s3) var(--s6);display:flex;align-items:center;gap:var(--s4);flex-shrink:0}
.header h1{font-size:var(--fs-lg);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;white-space:nowrap}
.header .meta{color:var(--muted);font-size:var(--fs-xs);margin-right:auto}
.header .status{display:flex;gap:var(--s2);align-items:center;font-size:var(--fs-xs)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.off{background:var(--red)}

/* ===== Tabs ===== */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;gap:2px;padding:0 var(--s3)}
.tab{padding:var(--s3) var(--s5);font-size:var(--fs-sm);color:var(--muted);background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all var(--dur-fast) var(--ease);white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:var(--s2)}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(0,212,170,.05)}
.tab .badge{background:var(--card);border:1px solid var(--border);border-radius:var(--r-full);padding:1px 8px;font-size:var(--fs-xs);color:var(--muted)}
.tab.active .badge{background:rgba(0,212,170,.15);color:var(--accent);border-color:rgba(0,212,170,.3)}

/* ===== Iframe Container ===== */
.frames{flex:1;position:relative;overflow:hidden}
.frame{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:var(--bg)}
.frame.active{display:block}
.frame-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:var(--s3);color:var(--muted);font-size:var(--fs-sm);z-index:1;background:var(--bg)}
.frame-loading .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Footer ===== */
.footer{background:var(--surface);border-top:1px solid var(--border);padding:var(--s2) var(--s6);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;font-size:var(--fs-xs);color:var(--muted)}
.footer .services{display:flex;gap:var(--s3)}
.svc{display:flex;align-items:center;gap:var(--s1)}

/* ===== Responsive ===== */
@media(max-width:768px){
  .header{padding:var(--s2) var(--s3)}
  .header h1{font-size:var(--fs-md)}
  .tab{padding:var(--s2) var(--s3);font-size:var(--fs-xs)}
  .footer{padding:var(--s1) var(--s3)}
}
@media(max-width:480px){
  .header .meta{display:none}
  .tab .badge{display:none}
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🎯 داشبورد البحث عن عمل</h1>
  <div class="meta">[Your Name] — كل أدوات البحث في مكان واحد</div>
  <a href="setup.html" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-full);padding:var(--s1) var(--s4);font-size:var(--fs-xs);color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:var(--s2);transition:all .15s ease" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">⚙️ الإعدادات</a>
  <div class="status">
    <div class="dot" id="dot-app" title="المحلل الذكي"></div>
    <div class="dot" id="dot-data" title="التقارير"></div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs" role="tablist">
  <button class="tab active" role="tab" data-tab="app" onclick="switchTab('app')">
    🔍 المحلل الذكي <span class="badge">142 وظيفة</span>
  </button>
  <button class="tab" role="tab" data-tab="analysis" onclick="switchTab('analysis')">
    📊 تحليل الوظائف <span class="badge">20 محللة</span>
  </button>
  <button class="tab" role="tab" data-tab="swot" onclick="switchTab('swot')">
    ⚡ تحليل SWOT
  </button>
  <button class="tab" role="tab" data-tab="alljobs" onclick="switchTab('alljobs')">
    📋 130 وظيفة <span class="badge">3 مصادر</span>
  </button>
</div>

<!-- Frames -->
<div class="frames">
  <div class="frame-loading" id="loading-app">
    <div class="spinner"></div>
    <div>جاري تحميل المحلل الذكي...</div>
  </div>
  <div class="frame-loading" id="loading-analysis" style="display:none">
    <div class="spinner"></div>
    <div>جاري تحميل تحليل الوظائف...</div>
  </div>
  <div class="frame-loading" id="loading-swot" style="display:none">
    <div class="spinner"></div>
    <div>جاري تحميل تحليل SWOT...</div>
  </div>
  <div class="frame-loading" id="loading-alljobs" style="display:none">
    <div class="spinner"></div>
    <div>جاري تحميل تقرير الوظائف...</div>
  </div>

  <iframe class="frame active" id="frame-app" data-src="http://127.0.0.1:8767/" allow="clipboard-write"></iframe>
  <iframe class="frame" id="frame-analysis" data-src="http://127.0.0.1:8768/data/analysis_report.html"></iframe>
  <iframe class="frame" id="frame-swot" data-src="http://127.0.0.1:8768/data/swot_report.html"></iframe>
  <iframe class="frame" id="frame-alljobs" data-src="http://127.0.0.1:8768/data/all_jobs_2026-09-15.html"></iframe>
</div>

<!-- Footer -->
<div class="footer">
  <div class="services">
    <div class="svc"><span class="dot on" id="svc-app"></span> app :8767</div>
    <div class="svc"><span class="dot on" id="svc-data"></span> data :8768</div>
    <div class="svc" id="svc-sqlite">🗄️ SQLite</div>
  </div>
  <div>آخر تحديث: <span id="update-time"></span></div>
</div>

<script>
// ===== Tab Logic =====
let current = 'app';
function switchTab(id) {
  if (id === current) return;
  // Hide current
  document.getElementById('frame-' + current).classList.remove('active');
  document.querySelector('[data-tab="' + current + '"]').classList.remove('active');
  document.getElementById('loading-' + current).style.display = 'none';
  // Show new
  document.querySelector('[data-tab="' + id + '"]').classList.add('active');
  const frame = document.getElementById('frame-' + id);
  const loader = document.getElementById('loading-' + id);
  // Lazy-load: only set src once
  if (!frame.src && frame.dataset.src) {
    loader.style.display = 'flex';
    frame.src = frame.dataset.src;
    frame.onload = function() {
      loader.style.display = 'none';
      frame.classList.add('active');
    };
    frame.onerror = function() {
      loader.innerHTML = '<div style="color:var(--red)">⚠️ فشل التحميل — تأكد من تشغيل الخادم على المنفذ</div>';
    };
  } else {
    frame.classList.add('active');
  }
  current = id;
  updateHash(id);
}

// ===== Hash Navigation =====
function updateHash(id) { history.replaceState(null, '', '#' + id); }
function initHash() {
  const h = location.hash.slice(1);
  if (['app','analysis','swot','alljobs'].includes(h)) switchTab(h);
}

// ===== Service Health Check =====
async function checkServices() {
  const checks = [
    { url: 'http://127.0.0.1:8767/', dot: 'svc-app', headerDot: 'dot-app' },
    { url: 'http://127.0.0.1:8768/data/swot_report.html', dot: 'svc-data', headerDot: 'dot-data' }
  ];
  for (const c of checks) {
    try {
      const r = await fetch(c.url, { mode: 'no-cors', method: 'HEAD' });
      document.getElementById(c.dot).className = 'dot on';
      document.getElementById(c.headerDot).className = 'dot on';
    } catch(e) {
      document.getElementById(c.dot).className = 'dot off';
      document.getElementById(c.headerDot).className = 'dot off';
    }
  }
  // Check SQLite exists
  try {
    const r = await fetch('http://127.0.0.1:8768/data/jobs.db', { method: 'HEAD' });
    document.getElementById('svc-sqlite').textContent = '🗄️ SQLite ✓';
  } catch(e) {
    document.getElementById('svc-sqlite').textContent = '🗄️ SQLite ⚠️';
  }
}

// ===== Init =====
document.getElementById('update-time').textContent = new Date().toLocaleDateString('ar-EG');
// Load first frame immediately
const firstFrame = document.getElementById('frame-app');
firstFrame.src = firstFrame.dataset.src;
firstFrame.onload = function() {
  document.getElementById('loading-app').style.display = 'none';
};
// Check services
checkServices();
// Hash navigation
initHash();
// Keyboard navigation
document.addEventListener('keydown', e => {
  const tabs = ['app','analysis','swot','alljobs'];
  const idx = tabs.indexOf(current);
  if (e.key === 'ArrowRight' && idx < tabs.length - 1) switchTab(tabs[idx + 1]);
  if (e.key === 'ArrowLeft' && idx > 0) switchTab(tabs[idx - 1]);
});
</script>
</body>
</html>
